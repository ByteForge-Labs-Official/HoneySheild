[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeynet-backend"
version = "1.0.0"
description = "IoT Honeynet Research Platform — FastAPI app"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Honeynet contributors" }]

dependencies = [
  # --- core web layer ---
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "gunicorn==22.0.0",
  "python-multipart==0.0.9",
  "pydantic==2.7.4",
  "pydantic-settings==2.3.4",
  "pydantic-extra-types==2.7.0",

  # --- security ---
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",          # pinned pin to avoid passlib warnings
  "PyJWT==2.8.0",
  "cryptography==42.0.8",

  # --- observability / logging ---
  "structlog==24.2.0",
  "loguru==0.7.2",
  "prometheus-client==0.20.0",
  "opentelemetry-api==1.25.0",
  "opentelemetry-sdk==1.25.0",
  "opentelemetry-instrumentation-fastapi==0.46b0",
  "opentelemetry-exporter-otlp==1.25.0",

  # --- data plane ---
  "SQLAlchemy[asyncio]==2.0.30",
  "asyncpg==0.29.0",
  "alembic==1.13.2",
  "psycopg2-binary>=2.9.10",
  "redis==5.0.4",
  "hiredis==2.3.2",

  # --- integrations ---
  "aiomqtt==2.3.1",                      # async MQTT for honeypot control
  "paho-mqtt==2.1.0",                    # sync fallback
  "httpx==0.27.0",
  "geoip2==4.8.0",
  "maxminddb==2.6.1",

  # --- AI / NLP ---
  "openai==1.30.1",
  "ollama==0.2.1",
  "tiktoken==0.7.0",

  # --- celery / workers ---
  "celery[redis]==5.4.0",
  "kombu==5.3.7",
  "flower==2.0.1",

  # --- utilities ---
  "python-dotenv==1.0.1",
  "tenacity==8.3.0",
  "orjson==3.10.3",
  "ujson==5.10.0",
  "pyyaml==6.0.1",
  "typer==0.12.3",
  "rich==13.7.1",
  "jinja2==3.1.4",
  "email-validator==2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-asyncio==0.23.7",
  "pytest-cov==5.0.0",
  "httpx==0.27.0",
  "ruff==0.4.9",
  "mypy==1.10.1",
  "types-redis==4.6.0.20240425",
  "types-passlib==1.7.7.20240602",
  "factory-boy==3.3.0",
  "faker==25.2.0",
  "freezegun==1.5.1",
  "respx==0.21.0",
  "moto==5.0.10",
  "ipython==8.24.0",
]

[project.scripts]
honeynet-api = "app.core.cli:serve"
honeynet-worker = "app.core.cli:worker"
honeynet-bootstrap = "app.core.cli:bootstrap"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "PT", "RET", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

