[project]
name = "honeynet-backend"
version = "1.0.0"
description = "IoT Honeynet Research Platform - FastAPI backend"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Honeynet contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "pydantic-extra-types>=2.9.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.1.0",
  "PyJWT>=2.9.0",
  "cryptography>=43.0.0",
  "structlog>=24.4.0",
  "loguru>=0.7.2",
  "prometheus-client>=0.21.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "SQLAlchemy[asyncio]>=2.0.31",
  "asyncpg>=0.30.0",
  "alembic>=1.13.2",
  "psycopg2-binary>=2.9.10",
  "redis>=5.0.4",
  "hiredis>=3.0.0",
  "aiomqtt>=2.3.1",
  "paho-mqtt>=2.1.0",
  "httpx>=0.27.0",
  "geoip2>=4.8.0",
  "maxminddb>=2.6.1",
  "openai>=1.30.1",
  "ollama>=0.2.1",
  "tiktoken>=0.8.0",
  "celery[redis]>=5.4.0",
  "kombu>=5.3.7",
  "flower>=2.0.1",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "orjson>=3.10.7",
  "ujson>=5.10.0",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "jinja2>=3.1.4",
  "email-validator>=2.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.7",
  "mypy>=1.10.1",
  "types-passlib>=1.7.7.20240304",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
