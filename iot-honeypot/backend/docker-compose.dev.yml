version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: honeynet-postgres
    environment:
      POSTGRES_DB: honeynet
      POSTGRES_USER: honeynet
      POSTGRES_PASSWORD: honeynet
    ports:
      - "5432:5432"
    volumes:
      - honeynet-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: honeynet-redis
    ports:
      - "6379:6379"

volumes:
  honeynet-pgdata:
