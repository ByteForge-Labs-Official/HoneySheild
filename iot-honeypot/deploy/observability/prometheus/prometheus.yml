# ============================================================================
# prometheus.yml — Honeynet scrape configuration
# ----------------------------------------------------------------------------
# All scrape targets live on the internal `ops-net` bridge.  Anything not
# listed here is invisible to Prometheus — defence in depth.
# ============================================================================
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: honeynet
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { component: 'self' }

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { host: 'gateway' }

  - job_name: relay
    metrics_path: /metrics
    static_configs:
      - targets: ['relay:9101']
        labels: { service: 'relay' }

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:2019']

  # The honeypot itself exposes only the SSH banner — no metrics.  We
  # scrape its side-car relay instead, plus the synthetic SSH banner
  # blackbox probe.
  - job_name: blackbox_ssh
    metrics_path: /probe
    params:
      module: [ssh_banner]
    static_configs:
      - targets: ['honeypot:2222']
    relabel_configs:
      - source_labels: [__address__]
        target_label:  __param_target
      - source_labels: [__param_target]
        target_label:  instance
      - target_label:  __address__
        replacement:   blackbox-exporter:9115