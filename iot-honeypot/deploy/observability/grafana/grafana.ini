# ============================================================================
# grafana.ini — Honeynet provisioning overlay.
# ----------------------------------------------------------------------------
# Datasources and dashboards are mounted from deploy/observability/grafana/.
# ============================================================================
[server]
http_addr = 0.0.0.0
http_port = 3000
domain   = honeynet.example.com
root_url = https://%(domain)s/

[security]
admin_user = ${GF_ADMIN_USER}
admin_password_file = /run/secrets/grafana_admin_password
secret_key_file     = /run/secrets/grafana_secret_key
disable_gravatar = true

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[log]
mode = console
level = info

[database]
type = postgres
host = postgres:5432
name = honeynet
user = ${GF_DB_USER}
password_file = /run/secrets/grafana_db_password