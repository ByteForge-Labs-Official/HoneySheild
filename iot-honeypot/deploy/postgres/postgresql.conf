# ============================================================================
# Custom postgres.conf overlay — appended to the image's main config at
# runtime via `command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]`.
#
# Values match the hardening checklist in deploy/docs/security.md:
#   • WAL compression — reduce IO on the volumes
#   • statement_timeout — the relay never needs to wait 24 h
#   • log_lock_waits — surface lock contention to Loki
#   • ssl — required by the platform
# ============================================================================
listen_addresses = '*'
port             = 5432

# SSL
ssl = on
ssl_cert_file   = '/etc/ssl/certs/honeynet.crt'
ssl_key_file    = '/etc/ssl/private/honeynet.key'
ssl_min_protocol_version = 'TLSv1.2'

# Performance / safety
shared_buffers          = 256MB
work_mem                = 16MB
maintenance_work_mem    = 128MB
effective_cache_size    = 1GB
wal_compression         = on
checkpoint_completion_target = 0.9
max_wal_size            = '2GB'

# Surfaces slow queries and lock waits to the JSON log.
log_min_duration_statement = 500
log_lock_waits             = on
log_temp_files             = 0

# Statement / idle timeouts.
statement_timeout = '60s'
idle_in_transaction_session_timeout = '10min'

# Autovacuum tuned for high-churn tables.
autovacuum_vacuum_scale_factor   = 0.05
autovacuum_analyze_scale_factor  = 0.025
autovacuum_max_workers           = 2