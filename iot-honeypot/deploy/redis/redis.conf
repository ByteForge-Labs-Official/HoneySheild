# ============================================================================
# redis.conf — Honeynet production profile.
# ----------------------------------------------------------------------------
# All values are tuned for the workload described in deploy/docs/architecture:
#   • The relay writes roughly 100 events/s during an active attack window.
#   • Streams cap at 100k entries (older ones XTRIM'd) so memory stays bounded.
#   • AOF + RDB hybrid so we can recover after a crash without losing more
#     than ~10s of activity.
# ============================================================================

bind 0.0.0.0 -::*
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# Memory — bounded.  Eviction policy falls back to allkeys-lru when the
# stream cache overruns, which is the right behaviour for hot fingerprints.
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence — AOF every second, RDB snapshot every 5 minutes if ≥ 100 keys.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 300 100

# Logging — JSON, sent to stdout for the Loki side-car.
loglevel notice
logfile ""

# Streams — bound the cache so a runaway relay can't fill the disk.
stream-node-max-entries 100000
streamsize-caching-threshold 10

# Slowlog — keep 1k entries, anything > 50 ms is logged.
slowlog-log-slower-than 50000
slowlog-max-len 1000

# Client output buffer for pub/sub subscribers — the dashboard fans out.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 64mb 16mb 60

# Latency tracking — required for redis_exporter latency metrics.
latency-tracking yes
latency-tracking-info-percentiles 50 95 99