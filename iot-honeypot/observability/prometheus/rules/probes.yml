groups:
  - name: probes.blackbox
    rules:
      - alert: HttpEndpointDown
        expr: probe_success{job=~"blackbox-http"} == 0
        for: 2m
        labels: { severity: critical, tier: probe }
        annotations:
          summary: "Blackbox probe failed for {{ $labels.instance }}"

      - alert: HttpEndpointSlow
        expr: probe_duration_seconds{job=~"blackbox-http"} > 2
        for: 5m
        labels: { severity: warning, tier: probe }
        annotations:
          summary: "{{ $labels.instance }} took {{ $value | printf \"%.2f\" }} s"

      - alert: TcpEndpointDown
        expr: probe_success{job=~"blackbox-tcp"} == 0
        for: 2m
        labels: { severity: critical, tier: probe }

      - alert: TlsCertExpiresSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
        for: 1h
        labels: { severity: warning, tier: probe }
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in < 14 d"