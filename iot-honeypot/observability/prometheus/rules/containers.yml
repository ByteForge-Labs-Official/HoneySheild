groups:
  - name: containers.liveness
    rules:
      - alert: ContainerKilledByOom
        expr: increase(container_oom_events_total[10m]) > 0
        for: 1m
        labels: { severity: critical, tier: container }
        annotations:
          summary: "OOM kill in {{ $labels.name }} on {{ $labels.instance }}"

      - alert: ContainerStale
        expr: time() - container_last_seen{name=~".+"} > 60
        for: 2m
        labels: { severity: warning, tier: container }
        annotations:
          summary: "Container {{ $labels.name }} not seen for > 60 s"

      - alert: ContainerCpuThrottling
        expr: rate(container_cpu_cfs_throttled_seconds_total[5m]) > 0
        for: 10m
        labels: { severity: warning, tier: container }

  - name: containers.resources
    rules:
      - alert: ContainerHighCpu
        expr: |
          (rate(container_cpu_usage_seconds_total{name=~".+"}[5m]) * 100) > 85
        for: 10m
        labels: { severity: warning, tier: container }

      - alert: ContainerHighMemory
        expr: |
          (container_memory_working_set_bytes{name=~".+"} / container_spec_memory_limit_bytes{name=~".+"}) * 100
          > 90
        for: 5m
        labels: { severity: critical, tier: container }
        annotations:
          summary: "Container {{ $labels.name }} using > 90 % of memory limit"

      - alert: ContainerHighTaskCount
        expr: container_tasks_state{name=~".+", state="running"} > 1000
        for: 10m
        labels: { severity: warning, tier: container }