apiVersion: 1

# ----------------------------------------------------------------------------
# Grafana-managed alerting rules (mirrored from Prometheus for in-Grafana UI).
# All metrics come from the Prometheus datasource provisioned above.
# ----------------------------------------------------------------------------
groups:
  - orgId: 1
    name: "honeynet-grafana-alerts"
    folder: "Honeynet"
    interval: 1m
    rules:
      - uid: "honeynet-host-cpu"
        title: "HostHighCpuUsage"
        condition: "C"
        data:
          - refId: "A"
            queryType: ""
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
              instant: false
              intervalMs: 30000
              maxDataPoints: 43200
              refId: "A"
          - refId: "C"
            queryType: ""
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: "C"
              expression: "A"
              conditions:
                - evaluator: { params: [85], type: "gt" }
                  operator: { type: "and" }
                  query: { params: ["A"] }
                  reducer: { type: "last" }
                  type: "query"
        noDataState: "NoData"
        execErrState: "Error"
        for: 5m
        labels: { severity: "warning", tier: "host" }
        annotations:
          summary: "Host {{ $labels.instance }} CPU > 85 %"
          runbook_url: "https://honeynet.local/docs/runbook/alerts/HostHighCpuUsage.md"

      - uid: "honeynet-api-errors"
        title: "ApiHighErrorRate"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "(sum by (handler) (rate(http_requests_total{status_code=~\"5..|4..\"}[5m]))) / (sum by (handler) (rate(http_requests_total[5m]))) * 100"
              instant: false
              refId: "A"
          - refId: "C"
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 0, to: 0 }
            model:
              type: threshold
              refId: "C"
              expression: "A"
              conditions:
                - evaluator: { params: [5], type: "gt" }
                  operator: { type: "and" }
                  query: { params: ["A"] }
                  reducer: { type: "last" }
                  type: "query"
        noDataState: "OK"
        execErrState: "Error"
        for: 5m
        labels: { severity: "critical", tier: "api" }
        annotations:
          summary: "API error rate > 5 % on {{ $labels.handler }}"

      - uid: "honeynet-honeypot-spike"
        title: "HoneypotUnauthSpike"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: "sum by (protocol) (rate(honeypot_unauth_attempts_total[5m]))"
              instant: false
              refId: "A"
          - refId: "C"
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 0, to: 0 }
            model:
              type: threshold
              refId: "C"
              expression: "A"
              conditions:
                - evaluator: { params: [100], type: "gt" }
                  operator: { type: "and" }
                  query: { params: ["A"] }
                  reducer: { type: "last" }
                  type: "query"
        noDataState: "OK"
        execErrState: "Error"
        for: 10m
        labels: { severity: "warning", tier: "honeypot" }
        annotations:
          summary: "> 100 unauth attempts/s on {{ $labels.protocol }}"