# Custom queries pinned on top of the default postgres_exporter.
honeynet_slow_queries_total:
  query: |
    SELECT
      current_database() AS database,
      count(*) AS value
    FROM pg_stat_activity
    WHERE state = 'active'
      AND now() - query_start > interval '1 second'
  metrics:
    - database:
        usage: "LABEL"
        description: "Database name"
    - value:
        usage: "COUNTER"
        description: "Number of queries currently running longer than 1 s"

honeynet_idle_in_tx_duration:
  query: |
    SELECT
      coalesce(max(extract(epoch FROM now() - state_change)), 0) * 1000 AS seconds
    FROM pg_stat_activity
    WHERE state = 'idle in transaction'
  metrics:
    - seconds:
        usage: "GAUGE"
        description: "Seconds since the longest idle-in-transaction client started"

honeynet_table_bloat:
  query: |
    SELECT
      schemaname || '.' || relname AS table_name,
      n_live_tup AS live,
      n_dead_tup AS dead,
      pg_total_relation_size(relid) AS size_bytes
    FROM pg_stat_user_tables
    WHERE n_dead_tup > 10000
  metrics:
    - table_name:
        usage: "LABEL"
    - live:
        usage: "GAUGE"
    - dead:
        usage: "GAUGE"
    - size_bytes:
        usage: "GAUGE"