# ----------------------------------------------------------------------------
# Blackbox exporter modules — `prometheus.yml` references each by name.
# ----------------------------------------------------------------------------
modules:

  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200, 204]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_body_matches_regexp: []
      fail_if_header_not_matches:
        # Only fail if response shape is broken (binary slug header missing)
        - header: content-type
          allow: false
      headers:
        X-Probe-Source: blackbox-exporter

  http_post:
    prober: http
    timeout: 10s
    http:
      method: POST
      valid_status_codes: [200, 201, 202]
      headers:
        Content-Type: application/json
      body: '{"probe": true}'

  tcp_connect:
    prober: tcp
    timeout: 5s

  tls_connect:
    prober: tcp
    timeout: 10s
    tcp:
      query_response:
        - expect: "^SSH-2.0-"
        - send: "\n"

  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4